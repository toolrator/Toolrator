name: Toolhub CI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/toolhub/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/*/package-lock.json'
      - '.github/workflows/toolhub-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/toolhub/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/*/package-lock.json'

permissions:
  contents: read

concurrency:
  group: toolhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/toolhub/package-lock.json

      - name: Install Dependencies
        working-directory: packages/toolhub
        run: npm ci

      - name: Run Typecheck
        working-directory: packages/toolhub
        run: npm run typecheck

      - name: Build Code
        working-directory: packages/toolhub
        run: npm run build

      - name: Run Tests
        working-directory: packages/toolhub
        run: npm test
