name: Publish to NPM Registry

# Per-package releases (see RELEASING.md):
#   tag `toolconnector-v0.0.2` -> publishes ONLY @toolrator/toolconnector
#   tag `toolpanel-v0.1.1`     -> publishes ONLY @toolrator/toolpanel
#
# The tag suffix and the package's package.json version MUST match exactly
# (see the "Verify tag matches package.json version" steps below). A mismatch
# fails the run before anything is installed or published. The version that
# lands on npm always comes from package.json — bump it before tagging,
# because npm rejects versions that were already published.
#
# Releases are maintainer-only: merging PRs into `main` never publishes.
# The easiest way to tag is GitHub's Releases page ("Draft a new release"),
# which creates the tag and fires this workflow in one click.
#
# Auth mode (OIDC-first, token fallback):
#   - Runners use Node 24 (npm >= 11.5.1), so the CLI automatically uses OIDC
#     (Trusted Publishing) when the package has a Trusted Publisher configured
#     on npmjs.com, and only falls back to NPM_TOKEN otherwise.
#   - Both packages now have Trusted Publishers configured. After the first
#     green OIDC publish for each, remove the NODE_AUTH_TOKEN env lines below,
#     delete the NPM_TOKEN secret, and revoke the npm token.

on:
  push:
    tags:
      - 'toolconnector-v*'
      - 'toolpanel-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-toolconnector:
    name: Publish @toolrator/toolconnector
    if: startsWith(github.ref_name, 'toolconnector-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        working-directory: packages/toolconnector
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#toolconnector-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$TAG_VERSION" ]; then
            echo "::error::Malformed release tag '${GITHUB_REF_NAME}'. Expected 'toolconnector-v<version>'."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match packages/toolconnector/package.json version '${PKG_VERSION}'."
            echo "::error::Run 'npm version ${TAG_VERSION} --no-git-tag-version' in packages/toolconnector, commit the bump, then delete and re-create the tag on that commit."
            exit 1
          fi
          echo "Tag and package.json agree on version ${PKG_VERSION}."

      - name: Install Dependencies
        working-directory: packages/toolconnector
        run: npm ci

      - name: Run Typecheck & Build
        working-directory: packages/toolconnector
        run: |
          npm run typecheck
          npm run build

      - name: Publish to NPM
        working-directory: packages/toolconnector
        # OIDC (Trusted Publishing) is preferred by npm >= 11.5.1; the token
        # below is only a fallback until OIDC is validated for this package.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-toolpanel:
    name: Publish @toolrator/toolpanel
    if: startsWith(github.ref_name, 'toolpanel-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        working-directory: packages/toolpanel
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#toolpanel-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$TAG_VERSION" ]; then
            echo "::error::Malformed release tag '${GITHUB_REF_NAME}'. Expected 'toolpanel-v<version>'."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match packages/toolpanel/package.json version '${PKG_VERSION}'."
            echo "::error::Run 'npm version ${TAG_VERSION} --no-git-tag-version' in packages/toolpanel, commit the bump, then delete and re-create the tag on that commit."
            exit 1
          fi
          echo "Tag and package.json agree on version ${PKG_VERSION}."

      - name: Install Dependencies
        working-directory: packages/toolpanel
        run: npm ci

      - name: Run Typecheck & Build
        working-directory: packages/toolpanel
        run: |
          npm run typecheck
          npm run build

      - name: Publish to NPM
        working-directory: packages/toolpanel
        # OIDC (Trusted Publishing) is preferred by npm >= 11.5.1; the token
        # below is only a fallback until OIDC is validated for this package.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
