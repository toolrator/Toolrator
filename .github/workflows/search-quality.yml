name: Search Quality Eval

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-quality-eval:
    name: Search Quality Eval
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/toolhub/package-lock.json

      - name: Check relevant changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" -- packages/toolhub .github/workflows/search-quality.yml)
          else
            CHANGED="always"
          fi
          if [ -z "$CHANGED" ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No changes to packages/toolhub or the workflow — eval will be skipped."
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes detected — running eval."
          fi

      - name: Install Dependencies
        if: steps.changes.outputs.relevant == 'true'
        working-directory: packages/toolhub
        run: npm ci

      - name: Build Code
        if: steps.changes.outputs.relevant == 'true'
        working-directory: packages/toolhub
        run: npm run build

      - name: Cache Embedding Model
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          # toolhub's embedder caches models at TOOLHUB_MODEL_CACHE (default
          # .cache/transformers, resolved from the package directory) — NOT
          # inside node_modules. The old @xenova/transformers path restored
          # nothing after the @huggingface/transformers upgrade, so every run
          # re-downloaded the 118 MB model and the eval went red whenever the
          # download flaked (every run since 2026-10-10).
          path: packages/toolhub/.cache/transformers
          key: toolhub-e5-model-${{ runner.os }}-${{ hashFiles('packages/toolhub/package-lock.json') }}

      - name: Provision Embedding Model
        if: steps.changes.outputs.relevant == 'true'
        working-directory: packages/toolhub
        run: |
          MODEL=.cache/transformers/Xenova/multilingual-e5-small/onnx/model_quantized.onnx
          EXPECTED_SHA=f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193
          ok() { [ -s "$MODEL" ] && [ "$(sha256sum "$MODEL" | cut -d" " -f1)" = "$EXPECTED_SHA" ]; }
          if ok; then echo "Embedding model present and verified."; exit 0; fi
          mkdir -p "$(dirname "$MODEL")"
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o "$MODEL" \
              https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx || true
            if ok; then echo "Embedding model downloaded and verified."; exit 0; fi
            echo "Attempt $i did not verify — retrying..."
            sleep $((i * 3))
          done
          echo "::error::Embedding model download failed verification after 5 attempts"
          exit 1

      - name: Run Search Quality Eval
        if: steps.changes.outputs.relevant == 'true'
        working-directory: packages/toolhub
        run: npm run eval:search
        env:
          MEILI_URL: http://127.0.0.1:7700
          TOOLHUB_PORT: "7600"
          SEARCH_ADMIN_TOKEN: dev-admin-token
          TOOLHUB_EMBEDDING_PROVIDER: local
          TOOLHUB_EMBEDDING_BATCH_SIZE: "32"
          TOOLHUB_MODEL_CACHE: .cache/transformers

      - name: Upload Eval Report
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: search-eval-report
          path: packages/toolhub/search-eval-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: No relevant changes
        if: steps.changes.outputs.relevant == 'false'
        run: echo "Eval skipped — no relevant changes."

  update-baseline:
    name: Refresh Baseline on Main
    needs: search-quality-eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/toolhub/package-lock.json

      - name: Install Dependencies
        working-directory: packages/toolhub
        run: npm ci

      - name: Build Code
        working-directory: packages/toolhub
        run: npm run build

      - name: Cache Embedding Model
        uses: actions/cache@v4
        with:
          # See the note in the job above: the model cache lives at
          # packages/toolhub/.cache/transformers (TOOLHUB_MODEL_CACHE), not in
          # node_modules.
          path: packages/toolhub/.cache/transformers
          key: toolhub-e5-model-${{ runner.os }}-${{ hashFiles('packages/toolhub/package-lock.json') }}

      - name: Provision Embedding Model
        working-directory: packages/toolhub
        run: |
          MODEL=.cache/transformers/Xenova/multilingual-e5-small/onnx/model_quantized.onnx
          EXPECTED_SHA=f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193
          ok() { [ -s "$MODEL" ] && [ "$(sha256sum "$MODEL" | cut -d" " -f1)" = "$EXPECTED_SHA" ]; }
          if ok; then echo "Embedding model present and verified."; exit 0; fi
          mkdir -p "$(dirname "$MODEL")"
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o "$MODEL" \
              https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx || true
            if ok; then echo "Embedding model downloaded and verified."; exit 0; fi
            echo "Attempt $i did not verify — retrying..."
            sleep $((i * 3))
          done
          echo "::error::Embedding model download failed verification after 5 attempts"
          exit 1

      - name: Run Search Quality Eval (update baseline)
        working-directory: packages/toolhub
        run: npm run eval:search:update
        env:
          MEILI_URL: http://127.0.0.1:7700
          TOOLHUB_PORT: "7600"
          SEARCH_ADMIN_TOKEN: dev-admin-token
          TOOLHUB_EMBEDDING_PROVIDER: local
          TOOLHUB_EMBEDDING_BATCH_SIZE: "32"
          TOOLHUB_MODEL_CACHE: .cache/transformers

      - name: Commit Updated Baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/toolhub/tests/fixtures/search-eval-baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged — nothing to commit."
          else
            git commit -m "chore(toolhub): update search eval baseline"
            git pull --rebase origin main
            git push
          fi
