name: Toolpanel CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'packages/toolpanel/**'
      - '.github/workflows/toolpanel-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'packages/toolpanel/**'

permissions:
  contents: read

concurrency:
  group: toolpanel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: packages/toolpanel/package-lock.json

      - name: Install Dependencies
        working-directory: packages/toolpanel
        run: npm ci

      - name: Run Typecheck
        working-directory: packages/toolpanel
        run: npm run typecheck

      - name: Build Code
        working-directory: packages/toolpanel
        run: npm run build
