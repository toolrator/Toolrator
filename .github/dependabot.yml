# Dependency-update automation. Disabled (limit 0) during the pre-release
# phase; re-enabled 2026-09-18 alongside the first stable-line release
# (toolconnector/toolpanel 0.1.0 published, main fully populated).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
